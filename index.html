<style>
/* ==========================================================================
   Ami Travel MVP — стили. Всё заскоуплено в #ami.
   ========================================================================== */
#ami{
  --bg:#0A0619; --bg2:#100A28; --surf:rgba(255,255,255,.045); --surf2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --ink:#F4F2FF; --mut:#A29CC0; --mut2:#7B7499;
  --acc:#01AAE3; --acc-d:#0089BD; --acc-s:rgba(1,170,227,.13);
  --vio:#7B5CFF; --warn:#E2604D; --ok:#39C07E;
  --r:18px; --maxw:1240px;
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#ami *,#ami *::before,#ami *::after{box-sizing:border-box;}
#ami img{max-width:100%;display:block;border:0;}
#ami a{color:inherit;text-decoration:none;}
#ami ul{margin:0;padding:0;list-style:none;}
#ami li{margin:0;padding:0;}
#ami p{margin:0 0 1em;}
#ami h1,#ami h2,#ami h3,#ami h4{font-family:'Unbounded','Manrope',sans-serif;font-weight:700;line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em;}
#ami h1{font-size:clamp(34px,5vw,60px);letter-spacing:-.035em;}
#ami h2{font-size:clamp(24px,2.7vw,36px);}
#ami h3{font-size:19px;}
#ami h4{font-size:15px;}
#ami button,#ami input,#ami select,#ami textarea{font-family:inherit;font-size:inherit;color:inherit;}
#ami svg{display:block;width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#ami .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}
#ami [hidden]{display:none !important;}

/* ---------- кнопки ---------- */
#ami .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:999px;
  font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;transition:.22s ease;background:none;white-space:nowrap;}
#ami .btn--p{background:var(--acc);color:#04121C;box-shadow:0 8px 26px rgba(1,170,227,.28);}
#ami .btn--p:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(1,170,227,.42);}
#ami .btn--g{border-color:var(--line2);background:rgba(255,255,255,.04);}
#ami .btn--g:hover{background:rgba(255,255,255,.10);}
#ami .btn--s{padding:9px 16px;font-size:14px;}
#ami .btn--wide{width:100%;}
#ami .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- шапка ---------- */
#ami .hdr{position:sticky;top:0;z-index:70;background:rgba(10,6,25,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
#ami .hdr__in{display:flex;align-items:center;gap:20px;height:66px;}
#ami .logo{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;cursor:pointer;flex:0 0 auto;}
#ami .logo img{width:28px;}
#ami .mainnav{display:flex;gap:4px;}
#ami .mainnav button{padding:8px 14px;border-radius:999px;border:0;background:none;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer;transition:.2s;}
#ami .mainnav button:hover{color:var(--ink);background:rgba(255,255,255,.06);}
#ami .mainnav button.on{color:var(--ink);background:rgba(255,255,255,.09);}
#ami .hdr__search{margin-left:auto;position:relative;flex:0 1 260px;}
#ami .hdr__search input{width:100%;padding:9px 14px 9px 38px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14.5px;transition:.2s;}
#ami .hdr__search input:focus{outline:none;border-color:var(--acc);background:rgba(255,255,255,.09);}
#ami .hdr__search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;}
#ami .iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 auto;}
#ami .iconbtn:hover{background:rgba(255,255,255,.10);}
#ami .iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;}
#ami .iconbtn b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#04121C;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:800;}
#ami .avatar{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transition:.2s;flex:0 0 auto;}
#ami .avatar:hover{background:rgba(255,255,255,.10);}
#ami .avatar i{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,var(--acc),var(--vio));display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;color:#04121C;}

#ami .burger{display:none;}

/* ---------- hero ---------- */
#ami .hero{position:relative;padding:clamp(56px,7vw,104px) 0 clamp(40px,5vw,64px);overflow:hidden;}
#ami .hero__bg{position:absolute;inset:0;background-size:cover;background-position:center 42%;opacity:.62;}
#ami .hero__veil{position:absolute;inset:0;background:
  radial-gradient(900px 460px at 78% 18%,rgba(1,170,227,.18),transparent 62%),
  linear-gradient(180deg,rgba(10,6,25,.60),rgba(10,6,25,.42) 38%,var(--bg) 97%);}
#ami .hero .wrap{position:relative;z-index:3;}
#ami .hero__in{max-width:760px;}
#ami .hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--acc),#8fe4ff 50%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;}
#ami .hero p{font-size:clamp(16px,1.35vw,19px);color:#D6D2EA;max-width:52ch;}

/* ---------- виджет поиска ---------- */
#ami .finder{position:relative;z-index:3;margin-top:32px;background:rgba(16,10,40,.78);backdrop-filter:blur(14px);
  border:1px solid var(--line2);border-radius:22px;padding:16px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end;}
#ami .finder label{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);margin-bottom:6px;}
#ami .finder select,#ami .finder input{width:100%;padding:12px 14px;border-radius:14px;background:rgba(10,6,25,.7);border:1px solid var(--line);font-size:15px;}
#ami .finder select{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%23A29CC0' stroke-width='2'><path d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
#ami .finder select:focus,#ami .finder input:focus{outline:none;border-color:var(--acc);}
#ami .quizhint{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14.5px;color:var(--mut);}
#ami .quizhint svg{width:17px;height:17px;stroke:var(--acc);}
#ami .quizhint button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;}

/* ---------- секции ---------- */
#ami .sec{padding:clamp(46px,5.5vw,80px) 0;}
#ami .sec--t{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
#ami .sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
#ami .sechead h2{margin:0;}
#ami .sechead p{margin:6px 0 0;color:var(--mut);font-size:15px;}
#ami .linkbtn{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px;}
#ami .linkbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;}

/* ---------- карточки туров ---------- */
#ami .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
#ami .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.25s ease;display:flex;flex-direction:column;}
#ami .card:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--surf2);}
#ami .card__img{position:relative;aspect-ratio:16/10;overflow:hidden;}
#ami .card__img img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
#ami .card:hover .card__img img{transform:scale(1.05);}
#ami .card__top{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
#ami .tag{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  background:rgba(10,6,25,.72);backdrop-filter:blur(6px);border:1px solid var(--line2);}
#ami .tag--d1{color:#8ce0b4;} #ami .tag--d2{color:#ffd487;} #ami .tag--d3{color:#ff9e8c;}
#ami .fav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,6,25,.66);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 34px;}
#ami .fav:hover{background:rgba(10,6,25,.9);transform:scale(1.08);}
#ami .fav svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.9;}
#ami .fav.on svg{fill:var(--warn);stroke:var(--warn);}
#ami .card__b{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;}
#ami .card__reg{font-size:12.5px;color:var(--mut2);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;}
#ami .card__t{font-family:'Unbounded',sans-serif;font-size:17px;line-height:1.25;margin-bottom:9px;}
#ami .card__m{display:flex;gap:14px;font-size:13.5px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap;}
#ami .card__m span{display:inline-flex;align-items:center;gap:5px;}
#ami .card__m svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
#ami .card__f{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);}
#ami .price{font-family:'Unbounded',sans-serif;font-size:19px;}
#ami .price small{display:block;font-family:'Manrope',sans-serif;font-size:12px;color:var(--mut2);font-weight:600;letter-spacing:0;}
#ami .rate{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;}
#ami .rate svg{width:15px;height:15px;fill:#FFC24A;stroke:none;}
#ami .rate i{font-style:normal;color:var(--mut2);font-weight:600;font-size:12.5px;}
#ami .match{position:absolute;bottom:10px;left:10px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:rgba(1,170,227,.92);color:#04121C;}

/* ---------- каталог ---------- */
#ami .catalog{display:grid;grid-template-columns:264px 1fr;gap:26px;align-items:start;}
#ami .filters{position:sticky;top:82px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;}
#ami .fgroup{padding:16px 0;border-bottom:1px solid var(--line);}
#ami .fgroup:first-child{padding-top:0;}
#ami .fgroup:last-child{border-bottom:0;padding-bottom:0;}
#ami .fgroup h4{margin:0 0 12px;font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);}
#ami .chk{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:14.5px;}
#ami .chk input{position:absolute;opacity:0;pointer-events:none;}
#ami .chk i{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);flex:0 0 19px;display:flex;align-items:center;justify-content:center;transition:.15s;}
#ami .chk i::after{content:"";width:9px;height:5px;border-left:2px solid #04121C;border-bottom:2px solid #04121C;transform:rotate(-45deg) scale(0);transition:.15s;margin-top:-2px;}
#ami .chk input:checked + i{background:var(--acc);border-color:var(--acc);}
#ami .chk input:checked + i::after{transform:rotate(-45deg) scale(1);}
#ami .chk span{color:var(--mut);transition:.15s;}
#ami .chk:hover span,#ami .chk input:checked ~ span{color:var(--ink);}
#ami .segs{display:flex;gap:6px;}
#ami .segs button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13.5px;font-weight:700;cursor:pointer;transition:.18s;}
#ami .segs button.on{background:var(--acc-s);border-color:var(--acc);color:#8fe4ff;}
#ami .rng{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line2);outline:none;margin:10px 0 4px;}
#ami .rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--acc);}
#ami .rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);cursor:pointer;border:3px solid var(--bg);}
#ami .rngval{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);}
#ami .catbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
#ami .catbar__n{font-size:14.5px;color:var(--mut);}
#ami .catbar__n b{color:var(--ink);font-family:'Unbounded',sans-serif;font-size:16px;}
#ami .sortsel{padding:9px 34px 9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:14px;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%23A29CC0' stroke-width='2'><path d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 13px center;cursor:pointer;}
#ami .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
#ami .chipx{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--acc-s);border:1px solid rgba(1,170,227,.35);
  font-size:13px;font-weight:700;color:#8fe4ff;cursor:pointer;}
#ami .chipx svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;}
#ami .empty{text-align:center;padding:64px 20px;border:1px dashed var(--line2);border-radius:var(--r);}
#ami .empty h3{margin-bottom:8px;}
#ami .empty p{color:var(--mut);}
#ami .cards--2{grid-template-columns:repeat(2,1fr);}

/* ---------- страница тура ---------- */
#ami .tourhead{position:relative;border-radius:24px;overflow:hidden;margin-bottom:26px;}
#ami .tourhead img{width:100%;height:clamp(240px,38vw,440px);object-fit:cover;}
#ami .tourhead__v{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,25,.25),rgba(10,6,25,.9));}
#ami .tourhead__c{position:absolute;left:0;right:0;bottom:0;padding:28px;}
#ami .tourhead h1{font-size:clamp(24px,3.2vw,42px);margin-bottom:10px;}
#ami .tourgrid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;}
#ami .block{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:20px;}
#ami .block h3{margin-bottom:16px;}
#ami .day{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
#ami .day:last-child{border-bottom:0;padding-bottom:0;}
#ami .day b{font-family:'Unbounded',sans-serif;font-size:11.5px;color:var(--acc);white-space:nowrap;letter-spacing:0;}
#ami .day h4{margin:0 0 4px;font-family:'Manrope',sans-serif;font-size:15.5px;font-weight:800;}
#ami .day p{margin:0;font-size:14.5px;color:var(--mut);}
#ami .incs{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
#ami .incs li{display:flex;gap:9px;padding:6px 0;font-size:14.5px;color:var(--mut);}
#ami .incs svg{width:17px;height:17px;flex:0 0 17px;margin-top:3px;fill:none;stroke-width:2.4;}
#ami .incs .y svg{stroke:var(--ok);} #ami .incs .n svg{stroke:var(--mut2);}
#ami .guide{display:flex;gap:16px;align-items:flex-start;}
#ami .gav{width:56px;height:56px;border-radius:50%;flex:0 0 56px;background:linear-gradient(140deg,var(--acc),var(--vio));display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;font-size:18px;color:#04121C;}
#ami .verif{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ok);margin-left:8px;}
#ami .verif svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;}
#ami .rev{padding:16px 0;border-bottom:1px solid var(--line);}
#ami .rev:last-child{border-bottom:0;padding-bottom:0;}
#ami .rev__h{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
#ami .rev__h b{font-size:14.5px;} #ami .rev__h span{font-size:13px;color:var(--mut2);}
#ami .rev p{margin:0;font-size:14.5px;color:var(--mut);}
#ami .booking{position:sticky;top:82px;background:linear-gradient(160deg,rgba(1,170,227,.10),transparent 60%),var(--surf);
  border:1px solid rgba(1,170,227,.28);border-radius:var(--r);padding:22px;}
#ami .booking .price{font-size:26px;margin-bottom:2px;}
#ami .field{margin-bottom:14px;}
#ami .field label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);margin-bottom:6px;}
#ami .field input,#ami .field select{width:100%;padding:12px 14px;border-radius:13px;background:rgba(10,6,25,.6);border:1px solid var(--line2);font-size:15px;transition:.2s;}
#ami .field select{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%23A29CC0' stroke-width='2'><path d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
#ami .field input:focus,#ami .field select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(1,170,227,.16);}
#ami .field.err input{border-color:var(--warn);}
#ami .cnt{display:flex;align-items:center;gap:10px;}
#ami .cnt button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);cursor:pointer;font-size:19px;line-height:1;transition:.18s;}
#ami .cnt button:hover:not(:disabled){background:rgba(255,255,255,.12);}
#ami .cnt b{min-width:26px;text-align:center;font-family:'Unbounded',sans-serif;}
#ami .sum{margin:16px 0;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px;}
#ami .sum div{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut);}
#ami .sum div.tot{color:var(--ink);font-weight:800;font-size:16px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);}
#ami .seats{font-size:13px;color:#ffd487;margin-top:10px;display:flex;align-items:center;gap:7px;}
#ami .seats svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
#ami .back{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-weight:700;font-size:14.5px;background:none;border:0;cursor:pointer;padding:0;margin-bottom:18px;}
#ami .back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
#ami .back:hover{color:var(--ink);}

/* ---------- гиды ---------- */
#ami .guides{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
#ami .gcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:.25s;}
#ami .gcard:hover{background:var(--surf2);transform:translateY(-3px);}
#ami .gcard p{font-size:14.5px;color:var(--mut);margin:14px 0 0;}
#ami .gstats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mut);}
#ami .gstats b{display:block;font-family:'Unbounded',sans-serif;font-size:17px;color:var(--ink);}

/* ---------- профиль ---------- */
#ami .plevel{background:linear-gradient(150deg,rgba(1,170,227,.16),rgba(123,92,255,.12)),var(--surf);
  border:1px solid rgba(1,170,227,.3);border-radius:22px;padding:28px;margin-bottom:22px;}
#ami .plevel__t{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap;}
#ami .plevel__b{width:66px;height:66px;border-radius:20px;background:var(--acc);color:#04121C;display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;font-size:26px;flex:0 0 66px;}
#ami .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0;}
#ami .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--vio));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
#ami .barm{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);}
#ami .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
#ami .badge{text-align:center;padding:18px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surf);opacity:.45;transition:.25s;}
#ami .badge.on{opacity:1;border-color:rgba(1,170,227,.4);background:var(--acc-s);}
#ami .badge i{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);font-style:normal;}
#ami .badge.on i{background:var(--acc);}
#ami .badge svg{width:21px;height:21px;stroke:var(--mut);fill:none;stroke-width:2;}
#ami .badge.on svg{stroke:#04121C;}
#ami .badge b{display:block;font-size:13.5px;margin-bottom:3px;}
#ami .badge span{font-size:11.5px;color:var(--mut2);line-height:1.3;display:block;}
#ami .trip{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
#ami .trip:last-child{border-bottom:0;}
#ami .trip img{width:96px;height:64px;object-fit:cover;border-radius:12px;}
#ami .trip b{display:block;font-size:15px;}
#ami .trip span{font-size:13.5px;color:var(--mut);}
#ami .trip em{font-style:normal;font-family:'Unbounded',sans-serif;font-size:14px;color:var(--acc);}
#ami .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
#ami .tabs button{padding:11px 16px;border:0;background:none;color:var(--mut);font-weight:700;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
#ami .tabs button.on{color:var(--ink);border-bottom-color:var(--acc);}

/* ---------- как работает ---------- */
#ami .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
#ami .stp{padding-top:26px;border-top:2px solid var(--line);position:relative;}
#ami .stp b{position:absolute;top:-13px;left:0;background:var(--bg2);padding-right:10px;font-family:'Unbounded',sans-serif;font-size:13px;color:var(--acc);}
#ami .stp h4{margin:0 0 7px;font-family:'Unbounded',sans-serif;font-size:16px;}
#ami .stp p{margin:0;font-size:14.5px;color:var(--mut);}

/* ---------- модалки ---------- */
#ami .modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
#ami .modal.open{display:flex;}
#ami .modal__bg{position:absolute;inset:0;background:rgba(5,3,14,.78);backdrop-filter:blur(6px);}
#ami .modal__w{position:relative;z-index:2;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--bg2);
  border:1px solid var(--line2);border-radius:24px;padding:30px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,.8,.2,1);}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#ami .modal__x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:center;justify-content:center;}
#ami .modal__x svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2.4;}
#ami .prog{display:flex;gap:6px;margin-bottom:22px;}
#ami .prog i{flex:1;height:4px;border-radius:4px;background:var(--line2);transition:.3s;}
#ami .prog i.on{background:var(--acc);}
#ami .opts{display:grid;gap:10px;}
#ami .opt{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:15px;border:1px solid var(--line2);background:rgba(255,255,255,.03);
  cursor:pointer;transition:.18s;text-align:left;width:100%;font-size:15.5px;font-weight:600;}
#ami .opt:hover{background:rgba(255,255,255,.09);border-color:var(--line2);}
#ami .opt.on{border-color:var(--acc);background:var(--acc-s);}
#ami .opt i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 22px;position:relative;}
#ami .opt.on i{border-color:var(--acc);}
#ami .opt.on i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--acc);}
#ami .modal .btn--p{margin-top:22px;}
#ami .succ{text-align:center;padding:12px 0;}
#ami .succ__i{width:74px;height:74px;border-radius:50%;background:var(--acc-s);border:1px solid rgba(1,170,227,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
#ami .succ__i svg{width:34px;height:34px;stroke:var(--acc);fill:none;stroke-width:2;}
#ami .xpgain{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--acc-s);border:1px solid rgba(1,170,227,.4);
  font-family:'Unbounded',sans-serif;font-size:15px;color:#8fe4ff;margin:6px 0 18px;}

/* ---------- тосты ---------- */
#ami .toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;}
#ami .toast{padding:12px 20px;border-radius:999px;background:rgba(16,10,40,.96);border:1px solid var(--line2);font-size:14.5px;font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:9px;}
#ami .toast svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2.4;}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- подвал ---------- */
#ami .foot{border-top:1px solid var(--line);padding:30px 0;margin-top:20px;}
#ami .foot__in{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;color:var(--mut2);font-size:13.5px;}
#ami .demo{background:rgba(123,92,255,.14);border:1px solid rgba(123,92,255,.35);color:#c9bcff;font-size:12px;font-weight:800;
  padding:5px 12px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;}

/* ---------- адаптив ---------- */
@media (max-width:1080px){
  #ami .catalog{grid-template-columns:1fr;}
  #ami .filters{position:static;}
  #ami .tourgrid{grid-template-columns:1fr;}
  #ami .booking{position:static;}
  #ami .cards,#ami .guides{grid-template-columns:repeat(2,1fr);}
  #ami .steps{grid-template-columns:repeat(2,1fr);}
  #ami .finder{grid-template-columns:1fr 1fr;}
}
@media (max-width:820px){
  #ami .mainnav{position:fixed;left:0;right:0;top:66px;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);
    padding:10px 22px 18px;display:none;z-index:80;}
  #ami .mainnav.open{display:flex;}
  #ami .mainnav button{text-align:left;padding:13px 12px;}
  #ami .burger{display:flex;order:-1;}
  #ami .hdr__search{flex:1 1 auto;margin-left:6px;}
  #ami .badges{grid-template-columns:repeat(2,1fr);}
  #ami .incs{grid-template-columns:1fr;gap:0;}
}
@media (max-width:640px){
  #ami{font-size:15.5px;}
  #ami .cards,#ami .cards--2,#ami .guides,#ami .steps{grid-template-columns:1fr;}
  #ami .finder{grid-template-columns:1fr;}
  #ami .wrap{padding:0 16px;}
  #ami .modal__w{padding:24px 20px;}
  #ami .trip{grid-template-columns:72px 1fr;}
  #ami .trip img{width:72px;height:54px;}
  #ami .trip em{grid-column:2;}
  #ami .avatar span{display:none;}
  #ami .avatar{padding:5px;}
  #ami .hdr__in{gap:9px;}
  #ami .hdr .logo span{display:none;}
  #ami .hdr__search{flex:1 1 auto;min-width:0;margin-left:2px;}
}
@media (prefers-reduced-motion:reduce){#ami *{transition-duration:.01ms !important;animation-duration:.01ms !important;}}

</style>
</head>

  putorana:[{n:'Андрей', d:'август 2026', r:5, t:'Девять дней без связи. Самое сильное, что со мной было. Готовьтесь физически, это не прогулка.'}],
  teriberka:[{n:'Оля', d:'февраль 2026', r:4, t:'За три дня успели всё. Сияние было слабое, но океан зимой перекрыл всё.'}]
};

const BADGES = [
  {id:'поход',    name:'Горный',      hint:'Пройти пеший маршрут'},
  {id:'вода',     name:'Водный',      hint:'Пройти сплав или каякинг'},
  {id:'зима',     name:'Зимний',      hint:'Съездить в зимний тур'},
  {id:'скалы',    name:'Вертикаль',   hint:'Пройти скалолазный тур'},
  {id:'сияние',   name:'Полярный',    hint:'Увидеть северное сияние'},
  {id:'вулканы',  name:'Огненный',    hint:'Подняться на вулкан'},
  {id:'каньоны',  name:'Каньоны',     hint:'Пройти маршрут по каньонам'},
  {id:'культура', name:'Этно',        hint:'Съездить в культурный маршрут'}
];

const LEVELS = [
  {n:1, name:'Новичок',        xp:0},
  {n:2, name:'Турист',         xp:300},
  {n:3, name:'Ходок',          xp:800},
  {n:4, name:'Исследователь',  xp:1500},
  {n:5, name:'Первопроходец',  xp:2500},
  {n:6, name:'Легенда троп',   xp:4000}
];

const ACTS = [
  {id:'поход',    label:'Пешие походы'},
  {id:'вода',     label:'Сплавы и каяки'},
  {id:'зима',     label:'Зимние маршруты'},
  {id:'лыжи',     label:'Лыжный туризм'},
  {id:'скалы',    label:'Скалолазание'},
  {id:'вулканы',  label:'Вулканы'},
  {id:'сияние',   label:'Северное сияние'},
  {id:'каньоны',  label:'Каньоны'},
  {id:'культура', label:'Культура и аулы'}
];

</script>
<script>
/* ==========================================================================
   Ami Travel MVP — логика прототипа.
   Состояние в памяти: избранное, поездки, XP, фильтры, подбор, бронирование.
   ========================================================================== */
(function(){
const root = document.getElementById('ami');

/* ---------- иконки ---------- */
const I = {
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0112 8a4 4 0 017 2.5C19 15.6 12 20 12 20z"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  peak:'<svg viewBox="0 0 24 24"><path d="M3 19l6-11 4 6 2.5-3.5L21 19z"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>',
  arr:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  arrl:'<svg viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3.5v5c0 5-3.5 8-8 9.5-4.5-1.5-8-4.5-8-9.5v-5z"/><path d="M9 12l2 2 4-4"/></svg>',
  fire:'<svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 6 5 9a5 5 0 01-10 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 .5-2-.5-5 1-7z"/></svg>',
  wave:'<svg viewBox="0 0 24 24"><path d="M3 9c3-3 5 3 8 0s5 3 8 0M3 16c3-3 5 3 8 0s5 3 8 0"/></svg>',
  snow:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4 7l16 10M20 7L4 17"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 01-10-10 8.5 8.5 0 1010 10z"/></svg>',
  route:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 010 6H9a3 3 0 000 6h6.5"/></svg>',
  burger:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
};
const ACT_ICON = {'поход':I.peak,'вода':I.wave,'зима':I.snow,'лыжи':I.snow,'скалы':I.peak,'вулканы':I.fire,'сияние':I.moon,'каньоны':I.route,'культура':I.route};
const DIFF = {1:'Лёгкий',2:'Средний',3:'Сложный'};

/* ---------- состояние ---------- */
const S = {
  view:'home',
  tour:null,
  fav:new Set(['altai']),
  trips:[
    {id:'baikal', date:'22 февраля', people:2, xp:420},
    {id:'chusovaya', date:'7 июня', people:4, xp:250}
  ],
  xp:1840,
  q:'',
  match:null,           // результаты подбора: {id:percent}
  ptab:'trips',
  f:{acts:new Set(), diff:new Set(), days:'', price:150000, sort:'pop'},
  book:{tour:null, date:'', people:1, ins:true, step:1}
};

const T = id => TOURS.find(t=>t.id===id);
const G = id => GUIDES.find(g=>g.id===id);
const money = n => n.toLocaleString('ru-RU').replace(/,/g,' ') + ' ₽';
const pword = (n,a,b,c) => { const m=n%100, k=n%10;
  return m>=11&&m<=14 ? c : k===1 ? a : k>=2&&k<=4 ? b : c; };
const plural = (n,a,b,c) => n + ' ' + pword(n,a,b,c);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function levelOf(xp){
  let cur = LEVELS[0], next = null;
  for (let i=0;i<LEVELS.length;i++){
    if (xp >= LEVELS[i].xp) { cur = LEVELS[i]; next = LEVELS[i+1] || null; }
  }
  return {cur, next};
}
function earnedBadges(){
  const set = new Set();
  S.trips.forEach(tr => (T(tr.id)||{act:[]}).act.forEach(a=>set.add(a)));
  return set;
}

/* ---------- тосты ---------- */
function toast(msg){
  const w = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className='toast'; d.innerHTML = I.check + '<span>'+esc(msg)+'</span>';
  w.appendChild(d);
  setTimeout(()=>{ d.style.transition='.4s'; d.style.opacity='0'; d.style.transform='translateY(10px)';
    setTimeout(()=>d.remove(),420); }, 2600);
}

/* ---------- карточка тура ---------- */
function cardHTML(t, showMatch){
  const g = G(t.guide);
  const pct = showMatch && S.match ? S.match[t.id] : null;
  return `<article class="card" data-tour="${t.id}">
    <div class="card__img">
      <img src="${IMG[t.img]}" alt="${esc(t.title)}" loading="lazy">
      <div class="card__top">
        <span class="tag tag--d${t.diff}">${DIFF[t.diff]}</span>
        <button class="fav ${S.fav.has(t.id)?'on':''}" data-fav="${t.id}" aria-label="В избранное">${I.heart}</button>
      </div>
      ${pct ? `<span class="match">Совпадение ${pct}%</span>` : ''}
    </div>
    <div class="card__b">
      <div class="card__reg">${esc(t.region)}</div>
      <div class="card__t">${esc(t.title)}</div>
      <div class="card__m">
        <span>${I.clock}${plural(t.days,'день','дня','дней')}</span>
        <span>${ACT_ICON[t.act[0]]||I.peak}${esc(t.act[0])}</span>
        <span>${I.user}${esc(g.name.split(' ')[0])}</span>
      </div>
      <div class="card__f">
        <div class="price">${money(t.price)}<small>за человека</small></div>
        <div class="rate">${I.star}${t.rating.toFixed(1)}<i>(${t.nreviews})</i></div>
      </div>
    </div>
  </article>`;
}

/* ---------- фильтрация ---------- */
function filtered(){
  const f = S.f;
  let list = TOURS.filter(t=>{
    if (S.q){
      const q = S.q.toLowerCase();
      if (!(t.title+' '+t.region+' '+t.act.join(' ')).toLowerCase().includes(q)) return false;
    }
    if (f.acts.size && !t.act.some(a=>f.acts.has(a))) return false;
    if (f.diff.size && !f.diff.has(String(t.diff))) return false;
    if (f.days === 'short' && t.days > 4) return false;
    if (f.days === 'mid'   && (t.days < 5 || t.days > 7)) return false;
    if (f.days === 'long'  && t.days < 8) return false;
    if (t.price > f.price) return false;
    return true;
  });
  const by = {
    pop:  (a,b)=> b.nreviews - a.nreviews,
    cheap:(a,b)=> a.price - b.price,
    exp:  (a,b)=> b.price - a.price,
    rate: (a,b)=> b.rating - a.rating,
    days: (a,b)=> a.days - b.days
  }[f.sort];
  if (S.match) list.sort((a,b)=> (S.match[b.id]||0)-(S.match[a.id]||0));
  else list.sort(by);
  return list;
}

/* ==========================================================================
   ЭКРАНЫ
   ========================================================================== */
function viewHome(){
  const pop = [...TOURS].sort((a,b)=>b.nreviews-a.nreviews).slice(0,6);
  const soon = [...TOURS].filter(t=>t.act.includes('зима')||t.days<=5).slice(0,3);
  return `
  <section class="hero">
    <div class="hero__bg" style="background-image:url(${IMG.kamchatka})"></div>
    <div class="hero__veil"></div>
    <div class="wrap">
      <div class="hero__in">
        <h1>Найди маршрут, <em>который тебя изменит</em></h1>
        <p>Активные путешествия по России от проверенных гидов. Подбор под твой уровень, честные условия и ни одного тура без модерации.</p>
      </div>
      <div class="finder">
        <div>
          <label>Что хочется</label>
          <select id="f-act">
            <option value="">Любая активность</option>
            ${ACTS.map(a=>`<option value="${a.id}">${a.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Регион</label>
          <select id="f-reg">
            <option value="">Вся Россия</option>
            ${[...new Set(TOURS.map(t=>t.region))].map(r=>`<option>${esc(r)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Бюджет до</label>
          <select id="f-price">
            <option value="150000">Не важно</option>
            <option value="30000">30 000 ₽</option>
            <option value="50000">50 000 ₽</option>
            <option value="80000">80 000 ₽</option>
          </select>
        </div>
        <button class="btn btn--p" id="f-go">${I.search}Показать</button>
      </div>
      <div class="quizhint">${I.info}<span>Не знаешь, с чего начать?</span>
        <button data-quiz="1">Пройди подбор за 5 вопросов</button></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sechead">
        <div><h2>Популярные маршруты</h2><p>Сортировка по числу отзывов реальных участников</p></div>
        <button class="linkbtn" data-go="catalog">Весь каталог ${I.arr}</button>
      </div>
      <div class="cards">${pop.map(t=>cardHTML(t)).join('')}</div>
    </div>
  </section>

  <section class="sec sec--t">
    <div class="wrap">
      <div class="sechead"><div><h2>Как это работает</h2></div></div>
      <div class="steps">
        <div class="stp"><b>01</b><h4>Подбор</h4><p>Пять вопросов про уровень, риск и бюджет — вместо перебора сотни сайтов.</p></div>
        <div class="stp"><b>02</b><h4>Проверка</h4><p>Каждый гид проходит модерацию: документы, опыт, отзывы участников.</p></div>
        <div class="stp"><b>03</b><h4>Бронь</h4><p>Прозрачная цена: видно, что входит и что придётся доплатить.</p></div>
        <div class="stp"><b>04</b><h4>Возвращение</h4><p>Маршрут даёт опыт и уровень — уровень открывает закрытые туры и скидки.</p></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sechead">
        <div><h2>Ближайшие выезды</h2><p>Места ещё есть, но их немного</p></div>
      </div>
      <div class="cards">${soon.map(t=>cardHTML(t)).join('')}</div>
    </div>
  </section>`;
}

function viewCatalog(){
  const list = filtered();
  const chips = [];
  S.f.acts.forEach(a=>chips.push({k:'act',v:a,l:(ACTS.find(x=>x.id===a)||{}).label||a}));
  S.f.diff.forEach(d=>chips.push({k:'diff',v:d,l:DIFF[d]}));
  if (S.f.days) chips.push({k:'days',v:S.f.days,l:{short:'До 4 дней',mid:'5–7 дней',long:'8+ дней'}[S.f.days]});
  if (S.f.price < 150000) chips.push({k:'price',v:'',l:'До '+money(S.f.price)});
  if (S.q) chips.push({k:'q',v:'',l:'Поиск: '+S.q});
  if (S.match) chips.push({k:'match',v:'',l:'Результат подбора'});

  return `<section class="sec"><div class="wrap">
    <div class="sechead">
      <div><h2>${S.match ? 'Подобрано для тебя' : 'Каталог маршрутов'}</h2>
      <p>${S.match ? 'Отсортировано по совпадению с твоими ответами' : 'Все туры прошли модерацию: документы гида, опыт, страховка'}</p></div>
      <button class="linkbtn" data-quiz="1">${I.route} Подобрать по параметрам</button>
    </div>
    <div class="catalog">
      <aside class="filters">
        <div class="fgroup">
          <h4>Активность</h4>
          ${ACTS.map(a=>`<label class="chk"><input type="checkbox" data-fact="${a.id}" ${S.f.acts.has(a.id)?'checked':''}><i></i><span>${a.label}</span></label>`).join('')}
        </div>
        <div class="fgroup">
          <h4>Сложность</h4>
          <div class="segs">
            ${[1,2,3].map(d=>`<button data-fdiff="${d}" class="${S.f.diff.has(String(d))?'on':''}">${DIFF[d]}</button>`).join('')}
          </div>
        </div>
        <div class="fgroup">
          <h4>Длительность</h4>
          <div class="segs">
            ${[['short','до 4'],['mid','5–7'],['long','8+']].map(([v,l])=>`<button data-fdays="${v}" class="${S.f.days===v?'on':''}">${l}</button>`).join('')}
          </div>
        </div>
        <div class="fgroup">
          <h4>Бюджет</h4>
          <input type="range" class="rng" id="f-rng" min="20000" max="150000" step="5000" value="${S.f.price}">
          <div class="rngval"><span>20 000 ₽</span><span id="f-rngv">${S.f.price>=150000?'без ограничений':'до '+money(S.f.price)}</span></div>
        </div>
        <div class="fgroup">
          <button class="btn btn--g btn--wide btn--s" data-reset="1">Сбросить фильтры</button>
        </div>
      </aside>
      <div>
        <div class="catbar">
          <div class="catbar__n"><b>${list.length}</b> ${pword(list.length,'маршрут','маршрута','маршрутов')} найдено</div>
          <select class="sortsel" id="f-sort" ${S.match?'disabled':''}>
            <option value="pop"   ${S.f.sort==='pop'?'selected':''}>Сначала популярные</option>
            <option value="rate"  ${S.f.sort==='rate'?'selected':''}>Высокий рейтинг</option>
            <option value="cheap" ${S.f.sort==='cheap'?'selected':''}>Сначала дешёвые</option>
            <option value="exp"   ${S.f.sort==='exp'?'selected':''}>Сначала дорогие</option>
            <option value="days"  ${S.f.sort==='days'?'selected':''}>Короткие поездки</option>
          </select>
        </div>
        ${chips.length ? `<div class="chips">${chips.map(c=>`<span class="chipx" data-unchip="${c.k}" data-v="${c.v}">${esc(c.l)}${I.x}</span>`).join('')}</div>` : ''}
        ${list.length
          ? `<div class="cards cards--2">${list.map(t=>cardHTML(t,true)).join('')}</div>`
          : `<div class="empty"><h3>Ничего не нашлось</h3><p>Попробуйте ослабить фильтры — например, поднять бюджет или убрать ограничение по сложности.</p>
             <button class="btn btn--g btn--s" data-reset="1" style="margin-top:16px">Сбросить фильтры</button></div>`}
      </div>
    </div>
  </div></section>`;
}

function viewTour(){
  const t = T(S.tour); if(!t) return viewCatalog();
  const g = G(t.guide);
  const revs = REVIEWS[t.id] || [];
  const b = S.book;
  const ins = b.ins ? 1490*b.people : 0;
  const total = t.price*b.people + ins;
  return `<section class="sec"><div class="wrap">
    <button class="back" data-go="catalog">${I.arrl} Назад в каталог</button>
    <div class="tourhead">
      <img src="${IMG[t.img]}" alt="${esc(t.title)}">
      <div class="tourhead__v"></div>
      <div class="tourhead__c">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
          <span class="tag tag--d${t.diff}">${DIFF[t.diff]}</span>
          ${t.act.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}
        </div>
        <h1>${esc(t.title)}</h1>
        <div style="display:flex;gap:18px;flex-wrap:wrap;color:#D6D2EA;font-size:15px">
          <span>${esc(t.region)}</span>
          <span>${plural(t.days,'день','дня','дней')}</span>
          <span class="rate">${I.star}${t.rating.toFixed(1)} <i>· ${plural(t.nreviews,'отзыв','отзыва','отзывов')}</i></span>
        </div>
      </div>
    </div>

    <div class="tourgrid">
      <div>
        <div class="block"><h3>О маршруте</h3><p style="color:var(--mut);margin:0">${esc(t.short)}</p></div>

        <div class="block">
          <h3>Программа по дням</h3>
          ${t.program.map(d=>`<div class="day"><b>ДЕНЬ ${d.d}</b><div><h4>${esc(d.t)}</h4><p>${esc(d.x)}</p></div></div>`).join('')}
        </div>

        <div class="block">
          <h3>Что входит в цену</h3>
          <div class="incs">
            <ul>${t.inc.map(x=>`<li class="y">${I.check}<span>${esc(x)}</span></li>`).join('')}</ul>
            <ul>${t.exc.map(x=>`<li class="n">${I.x}<span>${esc(x)}</span></li>`).join('')}</ul>
          </div>
        </div>

        <div class="block">
          <h3>Гид маршрута</h3>
          <div class="guide">
            <div class="gav">${g.name.split(' ').map(w=>w[0]).join('')}</div>
            <div>
              <div style="display:flex;align-items:center;flex-wrap:wrap">
                <b style="font-size:16px">${esc(g.name)}</b>
                <span class="verif">${I.shield}Проверен платформой</span>
              </div>
              <div style="color:var(--mut);font-size:14px;margin:4px 0 8px">${esc(g.city)} · ${plural(g.exp,'год','года','лет')} опыта · ${g.tours} маршрутов</div>
              <p style="margin:0;color:var(--mut);font-size:14.5px">${esc(g.about)}</p>
            </div>
          </div>
        </div>

        <div class="block">
          <h3>Отзывы участников</h3>
          ${revs.length ? revs.map(r=>`<div class="rev">
            <div class="rev__h"><b>${esc(r.n)}</b><span>${esc(r.d)}</span>
              <span class="rate">${I.star}${r.r}.0</span></div>
            <p>${esc(r.t)}</p></div>`).join('') : '<p style="color:var(--mut)">Пока нет отзывов.</p>'}
        </div>
      </div>

      <aside class="booking">
        <div class="price">${money(t.price)}<small>за человека</small></div>
        <div style="margin:16px 0 4px"></div>
        <div class="field">
          <label>Дата выезда</label>
          <select id="b-date">${t.dates.map(d=>`<option ${b.date===d?'selected':''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Участников</label>
          <div class="cnt">
            <button data-people="-1" ${b.people<=1?'disabled':''}>−</button>
            <b>${b.people}</b>
            <button data-people="1" ${b.people>=t.seats?'disabled':''}>+</button>
            <span style="color:var(--mut2);font-size:13px;margin-left:4px">свободно ${t.seats}</span>
          </div>
        </div>
        <label class="chk" style="margin:4px 0 0">
          <input type="checkbox" id="b-ins" ${b.ins?'checked':''}><i></i>
          <span>Страховка НС — 1 490 ₽/чел.</span>
        </label>
        <div class="sum">
          <div><span>${money(t.price)} × ${b.people}</span><span>${money(t.price*b.people)}</span></div>
          ${ins?`<div><span>Страховка × ${b.people}</span><span>${money(ins)}</span></div>`:''}
          <div class="tot"><span>Итого</span><span>${money(total)}</span></div>
        </div>
        <button class="btn btn--p btn--wide" data-book="${t.id}">Забронировать</button>
        <div class="seats">${I.clock}Осталось ${plural(t.seats,'место','места','мест')} в группе</div>
        <button class="btn btn--g btn--wide btn--s" style="margin-top:10px" data-fav="${t.id}">
          ${S.fav.has(t.id)?'В избранном':'В избранное'}
        </button>
      </aside>
    </div>
  </div></section>`;
}

function viewGuides(){
  return `<section class="sec"><div class="wrap">
    <div class="sechead"><div><h2>Гиды платформы</h2>
      <p>Модерация: документы, подтверждённый опыт, страховка и отзывы участников</p></div></div>
    <div class="guides">
      ${GUIDES.map(g=>{
        const n = TOURS.filter(t=>t.guide===g.id).length;
        return `<article class="gcard">
          <div style="display:flex;gap:14px;align-items:center">
            <div class="gav">${g.name.split(' ').map(w=>w[0]).join('')}</div>
            <div>
              <b style="font-size:16px">${esc(g.name)}</b>
              <div class="verif" style="margin:2px 0 0">${I.shield}Проверен</div>
              <div style="color:var(--mut2);font-size:13.5px">${esc(g.city)}</div>
            </div>
          </div>
          <p>${esc(g.about)}</p>
          <div class="gstats">
            <div><b>${g.rating.toFixed(1)}</b>рейтинг</div>
            <div><b>${g.exp}</b>лет опыта</div>
            <div><b>${g.tours}</b>групп</div>
            <div><b>${n}</b>в каталоге</div>
          </div>
        </article>`;
      }).join('')}
    </div>
  </div></section>`;
}

function viewProfile(){
  const {cur,next} = levelOf(S.xp);
  const got = earnedBadges();
  const pct = next ? Math.round((S.xp-cur.xp)/(next.xp-cur.xp)*100) : 100;
  const favs = TOURS.filter(t=>S.fav.has(t.id));
  return `<section class="sec"><div class="wrap">
    <div class="sechead"><div><h2>Профиль</h2><p>Демо-аккаунт: Иван, 25 лет</p></div></div>

    <div class="plevel">
      <div class="plevel__t">
        <div class="plevel__b">${cur.n}</div>
        <div style="flex:1;min-width:200px">
          <div style="font-family:'Unbounded',sans-serif;font-size:20px">${cur.name}</div>
          <div style="color:var(--mut);font-size:14px">${plural(S.trips.length,'маршрут пройден','маршрута пройдено','маршрутов пройдено')}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Unbounded',sans-serif;font-size:22px">${S.xp} XP</div>
          <div style="color:var(--mut);font-size:13.5px">всего опыта</div>
        </div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="barm">
        <span>${next ? (S.xp-cur.xp)+' / '+(next.xp-cur.xp)+' XP' : 'максимальный уровень'}</span>
        <span>${next ? 'до уровня «'+next.name+'»' : ''}</span>
      </div>
    </div>

    <div class="block">
      <h3>Бейджи</h3>
      <div class="badges">
        ${BADGES.map(b=>`<div class="badge ${got.has(b.id)?'on':''}">
          <i>${ACT_ICON[b.id]||I.peak}</i><b>${b.name}</b><span>${got.has(b.id)?'получен':b.hint}</span></div>`).join('')}
      </div>
    </div>

    <div class="tabs">
      <button data-ptab="trips" class="${S.ptab==='trips'?'on':''}">Мои поездки (${S.trips.length})</button>
      <button data-ptab="fav" class="${S.ptab==='fav'?'on':''}">Избранное (${S.fav.size})</button>
    </div>

    ${S.ptab==='trips'
      ? (S.trips.length ? `<div class="block">${S.trips.map(tr=>{
          const t=T(tr.id); if(!t) return '';
          return `<div class="trip" data-tour="${t.id}">
            <img src="${IMG[t.img]}" alt="">
            <div><b>${esc(t.title)}</b><span>${esc(tr.date)} · ${plural(tr.people,'участник','участника','участников')}</span></div>
            <em>+${tr.xp} XP</em></div>`;
        }).join('')}</div>`
        : `<div class="empty"><h3>Поездок пока нет</h3><p>Забронируйте первый маршрут — он появится здесь.</p></div>`)
      : (favs.length ? `<div class="cards">${favs.map(t=>cardHTML(t)).join('')}</div>`
        : `<div class="empty"><h3>Избранное пусто</h3><p>Нажмите на сердечко на карточке маршрута.</p></div>`)}
  </div></section>`;
}

/* ==========================================================================
   РЕНДЕР
   ========================================================================== */
function render(){
  const v = document.getElementById('view');
  v.innerHTML = ({home:viewHome, catalog:viewCatalog, tour:viewTour, guides:viewGuides, profile:viewProfile})[S.view]();
  document.querySelectorAll('#ami .mainnav button').forEach(b=>b.classList.toggle('on', b.dataset.go===S.view));
  document.getElementById('favn').textContent = S.fav.size;
  document.getElementById('favn').style.display = S.fav.size ? '' : 'none';
  const {cur} = levelOf(S.xp);
  document.getElementById('lvl').textContent = cur.n;
  document.getElementById('lvlname').textContent = cur.name;
  // прогресс-бары после вставки в DOM
  requestAnimationFrame(()=>{
    document.querySelectorAll('#ami .bar i[style]').forEach(i=>{ const w=i.style.width; i.style.width='0'; requestAnimationFrame(()=>i.style.width=w); });
  });
}
function go(view, id){
  S.view = view;
  if (view==='tour'){ S.tour = id; S.book = {tour:id, date:T(id).dates[0], people:1, ins:true, step:1}; }
  document.querySelector('#ami .mainnav').classList.remove('open');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ==========================================================================
   ПОДБОР (квиз)
   ========================================================================== */
const QUIZ = [
  {q:'Что тянет больше всего?', k:'act', o:[
    {l:'Горы и пешие маршруты', v:'поход'},
    {l:'Вода: сплавы и каяки',  v:'вода'},
    {l:'Зима, снег, север',     v:'зима'},
    {l:'Скалы и вертикаль',     v:'скалы'}]},
  {q:'Какой у тебя опыт?', k:'diff', o:[
    {l:'Первый активный тур',            v:1},
    {l:'Ходил пару раз, форма есть',     v:2},
    {l:'Опыт серьёзный, хочу нагрузку',  v:3}]},
  {q:'Сколько дней готов выделить?', k:'days', o:[
    {l:'Максимум выходные, 3–4 дня', v:'short'},
    {l:'Неделю, 5–7 дней',           v:'mid'},
    {l:'Больше недели',              v:'long'}]},
  {q:'Бюджет на человека?', k:'price', o:[
    {l:'До 40 000 ₽',       v:40000},
    {l:'40 000 – 80 000 ₽', v:80000},
    {l:'Больше 80 000 ₽',   v:150000}]},
  {q:'Что важнее в поездке?', k:'mood', o:[
    {l:'Виды, ради которых едут',   v:'view'},
    {l:'Нагрузка и вызов себе',     v:'hard'},
    {l:'Люди, культура, местные',   v:'people'},
    {l:'Тишина и отключиться',      v:'calm'}]}
];
const QA = {};
let qi = 0;

function openQuiz(){ qi=0; Object.keys(QA).forEach(k=>delete QA[k]); renderQuiz(); document.getElementById('quiz').classList.add('open'); }
function renderQuiz(){
  const w = document.getElementById('quizw');
  const step = QUIZ[qi];
  w.innerHTML = `
    <button class="modal__x" data-close="quiz">${I.x}</button>
    <div class="prog">${QUIZ.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join('')}</div>
    <div style="font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:8px">
      Вопрос ${qi+1} из ${QUIZ.length}</div>
    <h3 style="font-size:23px;margin-bottom:20px">${step.q}</h3>
    <div class="opts">
      ${step.o.map((o,i)=>`<button class="opt ${QA[step.k]===o.v?'on':''}" data-qopt="${i}"><i></i>${o.l}</button>`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:22px">
      ${qi>0?'<button class="btn btn--g" data-qback="1">Назад</button>':''}
      <button class="btn btn--p" style="flex:1;margin-top:0" data-qnext="1" ${QA[step.k]===undefined?'disabled':''}>
        ${qi===QUIZ.length-1?'Показать маршруты':'Дальше'}</button>
    </div>`;
}
function finishQuiz(){
  const res = {};
  TOURS.forEach(t=>{
    let s = 0;
    if (t.act.includes(QA.act)) s += 40;
    else if (QA.act==='зима' && t.act.includes('сияние')) s += 26;
    else if (QA.act==='поход' && t.act.includes('вулканы')) s += 26;
    s += Math.max(0, 30 - Math.abs(t.diff - QA.diff)*15);
    const band = t.days<=4?'short':t.days<=7?'mid':'long';
    if (band === QA.days) s += 20; else s += 6;
    if (t.price <= QA.price) s += 25; else s += Math.max(0, 25 - (t.price-QA.price)/4000);
    if (QA.mood==='hard'   && t.diff===3) s += 15;
    if (QA.mood==='view'   && ['putorana','baikal','kamchatka','altai'].includes(t.id)) s += 15;
    if (QA.mood==='people' && t.act.includes('культура')) s += 15;
    if (QA.mood==='calm'   && t.diff<=2 && t.days<=6) s += 12;
    res[t.id] = Math.max(41, Math.min(98, Math.round(52 + s/130*46)));
  });
  S.match = res;
  S.f = {acts:new Set(), diff:new Set(), days:'', price:150000, sort:'pop'};
  S.q = ''; document.getElementById('q').value = '';
  document.getElementById('quiz').classList.remove('open');
  go('catalog');
  toast('Подобрали ' + TOURS.length + ' маршрутов под ваши ответы');
}

/* ==========================================================================
   БРОНИРОВАНИЕ
   ========================================================================== */
function openBooking(id){
  S.book.tour = id; S.book.step = 1;
  renderBooking();
  document.getElementById('book').classList.add('open');
}
function renderBooking(){
  const b = S.book, t = T(b.tour);
  const ins = b.ins ? 1490*b.people : 0;
  const total = t.price*b.people + ins;
  const w = document.getElementById('bookw');
  if (b.step === 3){
    const xp = Math.round((t.days*60 + t.price/2000)/10)*10;
    w.innerHTML = `<button class="modal__x" data-close="book">${I.x}</button>
      <div class="succ">
        <div class="succ__i">${I.check}</div>
        <h3 style="font-size:23px">Заявка подтверждена</h3>
        <p style="color:var(--mut)">«${esc(t.title)}», ${esc(b.date)}, ${plural(b.people,'участник','участника','участников')}.<br>
        Гид свяжется с вами в течение дня.</p>
        <div class="xpgain">+${xp} XP за маршрут</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn--g" style="flex:1;margin:0" data-close="book">Закрыть</button>
          <button class="btn btn--p" style="flex:1;margin:0" data-go="profile" data-close="book">Открыть профиль</button>
        </div>
      </div>`;
    return;
  }
  w.innerHTML = `<button class="modal__x" data-close="book">${I.x}</button>
    <div class="prog"><i class="on"></i><i class="${b.step>=2?'on':''}"></i><i></i></div>
    <div style="font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:8px">
      Шаг ${b.step} из 2</div>
    <h3 style="font-size:22px;margin-bottom:6px">${b.step===1?'Проверьте детали':'Ваши контакты'}</h3>
    <p style="color:var(--mut);font-size:14.5px">${esc(t.title)} · ${esc(t.region)}</p>
    ${b.step===1 ? `
      <div class="field"><label>Дата выезда</label>
        <select id="bm-date">${t.dates.map(d=>`<option ${b.date===d?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Участников</label>
        <div class="cnt">
          <button data-people="-1" ${b.people<=1?'disabled':''}>−</button><b>${b.people}</b>
          <button data-people="1" ${b.people>=t.seats?'disabled':''}>+</button></div></div>
      <label class="chk"><input type="checkbox" id="bm-ins" ${b.ins?'checked':''}><i></i><span>Страховка НС — 1 490 ₽/чел.</span></label>
      <div class="sum">
        <div><span>${money(t.price)} × ${b.people}</span><span>${money(t.price*b.people)}</span></div>
        ${ins?`<div><span>Страховка</span><span>${money(ins)}</span></div>`:''}
        <div class="tot"><span>Итого</span><span>${money(total)}</span></div>
      </div>
      <button class="btn btn--p btn--wide" data-bstep="2">Продолжить</button>`
    : `
      <div class="field"><label>Имя</label><input id="bm-name" placeholder="Иван" value="Иван"></div>
      <div class="field"><label>Телефон или почта</label><input id="bm-contact" placeholder="ivan@mail.ru"></div>
      <div class="sum"><div class="tot"><span>К оплате</span><span>${money(total)}</span></div></div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn--g" data-bstep="1">Назад</button>
        <button class="btn btn--p" style="flex:1;margin:0" data-bsubmit="1">Подтвердить бронь</button>
      </div>
      <p style="font-size:12.5px;color:var(--mut2);text-align:center;margin:14px 0 0">
        Прототип: оплата не проводится, данные никуда не отправляются.</p>`}`;
}
function submitBooking(){
  const t = T(S.book.tour);
  const c = document.getElementById('bm-contact');
  if (!c.value.trim()){ c.parentElement.classList.add('err'); c.focus(); return; }
  const xp = Math.round((t.days*60 + t.price/2000)/10)*10;
  S.trips.unshift({id:t.id, date:S.book.date, people:S.book.people, xp});
  const before = levelOf(S.xp).cur.n;
  S.xp += xp;
  const after = levelOf(S.xp).cur;
  S.book.step = 3;
  renderBooking(); render();
  if (after.n > before) setTimeout(()=>toast('Новый уровень: '+after.name+'!'), 700);
}

/* ==========================================================================
   СОБЫТИЯ
   ========================================================================== */
root.addEventListener('click', function(e){
  const el = t => e.target.closest(t);
  let n;

  if ((n = el('[data-close]'))){ document.getElementById(n.dataset.close).classList.remove('open'); }
  if ((n = el('[data-quiz]'))){ openQuiz(); return; }
  if ((n = el('[data-go]'))){ go(n.dataset.go); return; }
  if ((n = el('[data-burger]'))){ document.querySelector('#ami .mainnav').classList.toggle('open'); return; }

  if ((n = el('[data-fav]'))){
    e.stopPropagation();
    const id = n.dataset.fav;
    if (S.fav.has(id)){ S.fav.delete(id); toast('Убрали из избранного'); }
    else { S.fav.add(id); toast('Добавили в избранное'); }
    render(); return;
  }
  if ((n = el('[data-tour]'))){ go('tour', n.dataset.tour); return; }
  if ((n = el('[data-book]'))){ openBooking(n.dataset.book); return; }

  /* фильтры */
  if ((n = el('[data-fdiff]'))){
    const v = n.dataset.fdiff;
    S.f.diff.has(v) ? S.f.diff.delete(v) : S.f.diff.add(v);
    S.match = null; render(); return;
  }
  if ((n = el('[data-fdays]'))){
    S.f.days = S.f.days === n.dataset.fdays ? '' : n.dataset.fdays;
    S.match = null; render(); return;
  }
  if ((n = el('[data-reset]'))){
    S.f = {acts:new Set(), diff:new Set(), days:'', price:150000, sort:'pop'};
    S.q=''; S.match=null; document.getElementById('q').value=''; render(); return;
  }
  if ((n = el('[data-unchip]'))){
    const k = n.dataset.unchip, v = n.dataset.v;
    if (k==='act') S.f.acts.delete(v);
    if (k==='diff') S.f.diff.delete(v);
    if (k==='days') S.f.days='';
    if (k==='price') S.f.price=150000;
    if (k==='q'){ S.q=''; document.getElementById('q').value=''; }
    if (k==='match') S.match=null;
    render(); return;
  }
  if ((n = el('[data-ptab]'))){ S.ptab = n.dataset.ptab; render(); return; }

  /* счётчик участников */
  if ((n = el('[data-people]'))){
    const t = T(S.book.tour || S.tour);
    S.book.people = Math.max(1, Math.min(t.seats, S.book.people + (+n.dataset.people)));
    if (document.getElementById('book').classList.contains('open')) renderBooking();
    else render();
    return;
  }

  /* квиз */
  if ((n = el('[data-qopt]'))){
    const step = QUIZ[qi];
    QA[step.k] = step.o[+n.dataset.qopt].v;
    renderQuiz(); return;
  }
  if ((n = el('[data-qnext]'))){
    if (qi === QUIZ.length-1) finishQuiz();
    else { qi++; renderQuiz(); }
    return;
  }
  if ((n = el('[data-qback]'))){ qi--; renderQuiz(); return; }

  /* бронирование */
  if ((n = el('[data-bstep]'))){ S.book.step = +n.dataset.bstep; renderBooking(); return; }
  if ((n = el('[data-bsubmit]'))){ submitBooking(); return; }

  /* поиск с главной */
  if ((n = el('#f-go'))){
    const a = document.getElementById('f-act').value;
    const r = document.getElementById('f-reg').value;
    const p = +document.getElementById('f-price').value;
    S.f = {acts:new Set(a?[a]:[]), diff:new Set(), days:'', price:p, sort:'pop'};
    S.q = r || ''; document.getElementById('q').value = S.q;
    S.match = null;
    go('catalog'); return;
  }

  /* клик по фону модалки */
  if (e.target.classList.contains('modal__bg')) e.target.parentElement.classList.remove('open');
});

root.addEventListener('change', function(e){
  const t = e.target;
  if (t.dataset.fact !== undefined){
    t.checked ? S.f.acts.add(t.dataset.fact) : S.f.acts.delete(t.dataset.fact);
    S.match = null; render();
  }
  if (t.id === 'f-sort'){ S.f.sort = t.value; render(); }
  if (t.id === 'b-date'){ S.book.date = t.value; }
  if (t.id === 'bm-date'){ S.book.date = t.value; renderBooking(); }
  if (t.id === 'b-ins'){ S.book.ins = t.checked; render(); }
  if (t.id === 'bm-ins'){ S.book.ins = t.checked; renderBooking(); }
});
root.addEventListener('input', function(e){
  if (e.target.id === 'f-rng'){
    S.f.price = +e.target.value;
    document.getElementById('f-rngv').textContent = S.f.price>=150000 ? 'без ограничений' : 'до '+money(S.f.price);
  }
  if (e.target.id === 'q'){
    S.q = e.target.value; S.match = null;
    if (S.view !== 'catalog') { S.view='catalog'; render(); document.getElementById('q').focus(); }
    else render();
  }
});
root.addEventListener('change', function(e){
  if (e.target.id === 'f-rng') render();
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape') document.querySelectorAll('#ami .modal.open').forEach(m=>m.classList.remove('open'));
});

render();
})();

</script>
